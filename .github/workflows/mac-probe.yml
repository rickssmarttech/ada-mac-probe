name: mac-probe
on:
  push:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Run probe (headed + headless, Chrome + Chromium)
        env:
          CENSUS_BASE: ${{ secrets.CENSUS_BASE }}
        run: node mac_probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-probe-results
          path: results/
